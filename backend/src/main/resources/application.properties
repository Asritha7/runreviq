server.address=127.0.0.1
server.port=8081
spring.application.name=runreviq-java
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
# Explicit opt-in only; never auto-fall back from Google to demo credentials.
runreviq.auth.mode=disabled
runreviq.auth.origin=http://127.0.0.1:8081
# Keep any framework CSRF/session cookies separate from other local applications.
server.servlet.session.cookie.name=runreviq_java_framework
server.forward-headers-strategy=none
# Evidence reads require a separate private reader configuration.
runreviq.database.enabled=false

# Private draft writes are separately opt-in with a restricted writer credential.
runreviq.drafts.enabled=false

# Independent review/publication require separate operator allowlists and credentials.
runreviq.workflows.enabled=false

# Optional precision candidate; the frozen migration baseline remains the default.
runreviq.search.mode=reviewed-v5
